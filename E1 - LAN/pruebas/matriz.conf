# =============================================================================
# pruebas/matriz.conf - matriz de pruebas de la LAN (Estudiante 1)
#
# La lee pruebas/probar.sh. Cada perfil se ejecuta DENTRO del equipo indicado:
#     sudo /mnt/proyecto/pruebas/probar.sh <perfil>
# o todos de una vez desde el host:   ./lab/lab.sh probar
#
# perfil <nombre> <vm donde se ejecuta>
perfil admin    pc-admin01
perfil users    pc-user01
perfil users2   pc-user02
perfil intruso  pc-intruso
perfil mgmt     pc-mgmt01
perfil zbx      zbx-srv01

# caso | perfil | tipo | destino | puerto | esperado | descripcion
#
#   tipo       que hace                                      esperado
#   ip         lee la IPv4 de lan0                           la direccion que debe tener
#   ping       2 pings al destino                            OK | BLOQUEADO
#   tcp        abre una conexion TCP destino:puerto          OK | BLOQUEADO | RECHAZADO
#   http/https pide http(s)://destino                        codigo HTTP (200, 403...) | BLOQUEADO
#   internet   pide una pagina de Internet (con DNS)         OK | BLOQUEADO
#   dhcp       'renovar': suelta y vuelve a pedir la IP      la direccion que debe recibir
#              'pedir': pide IP por DHCP una sola vez        SIN-OFERTA (si nadie contesta)
#   estatica   pone a mano la IP 'destino' y la puerta de enlace 'puerto'   OK (preparacion)
#   limpiar    quita la IP puesta a mano                     OK
#
#   BLOQUEADO = no hubo respuesta (la ACL descarta en silencio)
#   RECHAZADO = hubo respuesta negativa (se llego al equipo pero el puerto esta cerrado)
# =============================================================================

# ---- ADMIN (PC-ADMIN01, 192.168.10.50): llega a todo -------------------------
A01 | admin | ip       | lan0                    | -   | 192.168.10.50 | IP manual de la VLAN 10
A02 | admin | ping     | 192.168.10.1            | -   | OK            | Puerta de enlace de su VLAN
A03 | admin | ping     | 192.168.40.1            | -   | OK            | ADMIN puede hacer ping a cualquier interfaz de R1
A04 | admin | tcp      | 192.168.10.1            | 22  | OK            | SSH a R1-LAN
A05 | admin | ping     | 192.168.20.10           | -   | OK            | ADMIN -> USUARIOS (PC-USER01)
A06 | admin | ping     | 192.168.30.10           | -   | OK            | ADMIN -> SERVIDORES (ZBX-SRV01)
A07 | admin | http     | 192.168.30.10/zabbix/   | 80  | 200           | Web de Zabbix: solo ADMIN la abre
A08 | admin | tcp      | 192.168.30.20           | 22  | OK            | SSH a SRV-INTRA01
A09 | admin | ping     | 192.168.40.2            | -   | OK            | ADMIN -> GESTION (SW-CORE01)
A10 | admin | tcp      | 192.168.40.2            | 22  | OK            | SSH a SW-CORE01
A11 | admin | tcp      | 192.168.40.3            | 22  | OK            | SSH a SW-ACC01
A12 | admin | internet | -                       | -   | OK            | ADMIN -> Internet

# ---- USUARIOS (PC-USER01, registrado: aa:bb:cc:dd:ee:01 -> .10) --------------
U01 | users | ip       | lan0                    | -   | 192.168.20.10 | DHCP: recibio la IP reservada para su MAC
U02 | users | dhcp     | renovar                 | -   | 192.168.20.10 | DHCP: al soltar y volver a pedir recibe la MISMA IP
U03 | users | ping     | 192.168.20.1            | -   | OK            | Puerta de enlace de su VLAN
U04 | users | ping     | 192.168.10.50           | -   | BLOQUEADO     | USUARIOS -> ADMIN denegado
U05 | users | ping     | 192.168.40.10           | -   | BLOQUEADO     | USUARIOS -> GESTION denegado
U06 | users | tcp      | 192.168.40.2            | 22  | BLOQUEADO     | USUARIOS -> SSH del switch denegado
U07 | users | http     | 192.168.30.20/          | 80  | 200           | Intranet por HTTP: permitido
U08 | users | https    | 192.168.30.20/          | 443 | 200           | Intranet por HTTPS: permitido
U09 | users | ping     | 192.168.30.20           | -   | BLOQUEADO     | Ping a la Intranet: denegado (solo 80/443)
U10 | users | tcp      | 192.168.30.20           | 22  | BLOQUEADO     | SSH a la Intranet: denegado
U11 | users | http     | 192.168.30.10/zabbix/   | 80  | BLOQUEADO     | Web de Zabbix: denegada a usuarios
U12 | users | ping     | 192.168.30.10           | -   | BLOQUEADO     | Ping a Zabbix: denegado
U13 | users | tcp      | 192.168.20.1            | 22  | BLOQUEADO     | SSH a R1-LAN: denegado a usuarios
U14 | users | ping     | 192.168.10.1            | -   | BLOQUEADO     | Ping a la puerta de enlace de OTRA VLAN: denegado
U15 | users | internet | -                       | -   | OK            | USUARIOS registrados -> Internet

# ---- USUARIOS (PC-USER02, registrado: aa:bb:cc:dd:ee:02 -> .11) --------------
V01 | users2 | ip      | lan0                    | -   | 192.168.20.11 | DHCP: recibio la IP reservada para su MAC
V02 | users2 | ping    | 192.168.10.50           | -   | BLOQUEADO     | USUARIOS -> ADMIN denegado
V03 | users2 | http    | 192.168.30.20/          | 80  | 200           | Intranet por HTTP: permitido
V04 | users2 | internet| -                       | -   | OK            | USUARIOS registrados -> Internet

# ---- INTRUSO (PC-INTRUSO, aa:bb:cc:dd:ee:99, NO registrado) -------------------
I01 | intruso | dhcp     | pedir                 | -   | SIN-OFERTA    | DHCP restringido: nadie contesta a una MAC no registrada
I02 | intruso | estatica | 192.168.20.99/24      | 192.168.20.1 | OK   | (preparacion) se pone a mano una IP libre de la red
I03 | intruso | ping     | 192.168.20.1          | -   | BLOQUEADO     | Ni siquiera la puerta de enlace le responde
I04 | intruso | http     | 192.168.30.20/        | 80  | BLOQUEADO     | Intranet: denegada (par MAC.IP no registrado)
I05 | intruso | ping     | 192.168.10.50         | -   | BLOQUEADO     | ADMIN: denegado
I06 | intruso | tcp      | 1.1.1.1               | 80  | BLOQUEADO     | Internet por IP: denegado
I07 | intruso | internet | -                     | -   | BLOQUEADO     | Internet: denegado
I08 | intruso | estatica | 192.168.20.12/24      | 192.168.20.1 | OK   | (preparacion) usa la IP de un equipo registrado (PC-USER03) con su propia MAC
I09 | intruso | ping     | 192.168.20.1          | -   | BLOQUEADO     | IP registrada pero MAC distinta: denegado
I10 | intruso | http     | 192.168.30.20/        | 80  | BLOQUEADO     | IP registrada pero MAC distinta: denegado
I11 | intruso | limpiar  | lan0                  | -   | OK            | (limpieza) quita la IP puesta a mano

# ---- GESTION (PC-MGMT01, 192.168.40.10) ---------------------------------------
M01 | mgmt | ip       | lan0                     | -   | 192.168.40.10 | IP manual de la VLAN 40
M02 | mgmt | ping     | 192.168.40.1             | -   | OK            | Puerta de enlace de su VLAN
M03 | mgmt | tcp      | 192.168.40.1             | 22  | OK            | SSH a R1-LAN: permitido desde GESTION
M04 | mgmt | ping     | 192.168.40.2             | -   | OK            | SW-CORE01 (misma VLAN, sin pasar por R1)
M05 | mgmt | tcp      | 192.168.30.20            | 22  | OK            | GESTION -> SSH de servidores: permitido
M06 | mgmt | ping     | 192.168.30.10            | -   | OK            | GESTION -> ping a servidores: permitido
M07 | mgmt | http     | 192.168.30.10/zabbix/    | 80  | BLOQUEADO     | Web de Zabbix: denegada a GESTION
M08 | mgmt | ping     | 192.168.10.50            | -   | BLOQUEADO     | GESTION -> ADMIN denegado
M09 | mgmt | ping     | 192.168.20.10            | -   | BLOQUEADO     | GESTION -> USUARIOS denegado
M10 | mgmt | internet | -                        | -   | OK            | GESTION -> Internet: solo web y DNS (actualizaciones)

# ---- SERVIDORES (ZBX-SRV01, 192.168.30.10): solo monitoreo --------------------
Z01 | zbx | ip       | lan0                      | -   | 192.168.30.10 | IP manual de la VLAN 30
Z02 | zbx | ping     | 192.168.30.1              | -   | OK            | Puerta de enlace de su VLAN
Z03 | zbx | ping     | 192.168.10.50             | -   | OK            | Zabbix -> ping a ADMIN (monitoreo)
Z04 | zbx | ping     | 192.168.20.10             | -   | OK            | Zabbix -> ping a USUARIOS (monitoreo)
Z05 | zbx | ping     | 192.168.40.2              | -   | OK            | Zabbix -> ping a SW-CORE01
Z06 | zbx | ping     | 192.168.40.3              | -   | OK            | Zabbix -> ping a SW-ACC01
Z07 | zbx | tcp      | 192.168.40.2              | 10050 | OK          | Zabbix -> agente de SW-CORE01 (TCP 10050)
Z08 | zbx | tcp      | 192.168.10.50             | 22  | BLOQUEADO     | SERVIDORES -> SSH de ADMIN denegado
Z09 | zbx | tcp      | 192.168.20.10             | 22  | BLOQUEADO     | SERVIDORES -> SSH de USUARIOS denegado
Z10 | zbx | tcp      | 192.168.40.2              | 22  | BLOQUEADO     | SERVIDORES -> SSH de GESTION denegado
Z11 | zbx | internet | -                         | -   | OK            | SERVIDORES -> Internet
