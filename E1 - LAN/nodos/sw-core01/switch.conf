# /etc/xelaju/switch.conf - SW-CORE01 (switch de nucleo)
# Lo leen switch-aplicar y switch-mostrar. Formato: variables de shell.

NOMBRE="SW-CORE01"

# VLAN que conoce el switch, como  id:NOMBRE  (equivale a: vlan 10 / name ADMIN)
VLANS="10:ADMIN 20:USUARIOS 30:SERVIDORES 40:GESTION"

# Gestion del switch: una IP estatica en la VLAN 40 (equivale a: interface vlan 40)
VLAN_GESTION=40
IP_GESTION="192.168.40.2/24"
GW_GESTION="192.168.40.1"
