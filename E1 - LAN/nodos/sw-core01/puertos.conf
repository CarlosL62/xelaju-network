# /etc/xelaju/puertos.conf - SW-CORE01: tabla de puertos
#
# puerto  modo     vlan(s)       descripcion
#   access  <vlan>          puerto de acceso: tramas sin etiqueta, una sola VLAN
#   trunk   <v1,v2,...>     troncal 802.1Q: solo pasan las VLAN de la lista, etiquetadas
#   span    <puerto origen> puerto espejo: recibe copia de todo el trafico del origen
#   apagado -               puerto deshabilitado (shutdown)

p0        trunk    10,20,30,40   Troncal a R1-LAN (trunk0)
p1        trunk    10,20,40      Troncal a SW-ACC01 (VLAN 30 podada: alli no hay servidores)
p2        access   30            ZBX-SRV01
p3        access   30            SRV-INTRA01
p4        access   40            PC-MGMT01
p5        span     p0            SPAN: espejo de la troncal a R1 (para Wireshark / Est. 5)
