# /etc/zabbix/zabbix_agent2.d/xelaju-r1.conf - items propios de R1-LAN
# Cada UserParameter es:  clave,orden que imprime un numero
# En Zabbix se crean como items de tipo "Zabbix agent (active)" con estas claves.

# Equipos registrados en /etc/xelaju/usuarios.csv
UserParameter=xelaju.dhcp.registrados,/usr/local/sbin/xelaju-metrica registrados

# Prestamos concedidos (lineas DHCPACK del registro actual)
UserParameter=xelaju.dhcp.ack,/usr/local/sbin/xelaju-metrica dhcp_ack

# Peticiones rechazadas de equipos no registrados
UserParameter=xelaju.dhcp.rechazos,/usr/local/sbin/xelaju-metrica dhcp_rechazos

# Paquetes bloqueados por las ACL (lineas ACL-DENY del registro actual)
UserParameter=xelaju.acl.bloqueos,/usr/local/sbin/xelaju-metrica acl_bloqueos
