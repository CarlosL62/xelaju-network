# /etc/sysctl.d/90-xelaju-router.conf - R1-LAN como router

# Reenvio de paquetes IPv4 entre interfaces: es lo que convierte a Debian en router.
net.ipv4.ip_forward = 1

# Filtro de camino inverso en modo "loose" (2): se acepta un paquete si su
# origen es alcanzable por CUALQUIER interfaz. El modo estricto (1) descartaria
# trafico legitimo si en el grupo aparece una ruta asimetrica.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Un router no acepta ni envia ICMP redirect (evita que alguien desvie rutas).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Tampoco enrutamiento en origen.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Registrar paquetes con direcciones imposibles (origen que no deberia llegar
# por esa interfaz).
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
