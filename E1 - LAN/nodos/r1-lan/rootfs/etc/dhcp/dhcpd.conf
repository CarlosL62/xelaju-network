# /etc/dhcp/dhcpd.conf - R1-LAN: DHCP RESTRINGIDO de la VLAN 20 (USUARIOS)
# Servicio: isc-dhcp-server, nativo de Debian (el enunciado prohibe Kea).
#
# Idea: el servidor NO tiene un rango de direcciones para repartir. Solo
# entrega la IP reservada a los equipos cuya MAC esta registrada en
# /etc/xelaju/usuarios.csv. Un equipo desconocido envia DHCPDISCOVER y no
# recibe ninguna oferta.

# Este es el servidor DHCP oficial de la red: puede corregir (DHCPNAK) a un
# cliente que pida una direccion que no le corresponde.
authoritative;

# Los mensajes van a syslog con la facilidad local7; rsyslog los separa en
# /var/log/xelaju/dhcpd.log
log-facility local7;

# Sin actualizaciones dinamicas de DNS.
ddns-update-style none;

# Un cliente sin declaracion "host" no puede obtener direccion.
boot-unknown-clients false;

# Duracion del prestamo: 10 minutos (20 como maximo). Corta a proposito: en
# una demostracion se ve pronto la renovacion, que entrega siempre la MISMA IP.
default-lease-time 600;
max-lease-time 1200;

# Red de la VLAN 20. Lo que recibe cada cliente registrado:
subnet 192.168.20.0 netmask 255.255.255.0 {
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.20.255;
    option routers 192.168.20.1;                      # puerta de enlace = R1 trunk0.20
    option domain-name-servers 8.8.8.8, 1.1.1.1;      # validos en modo individual y grupal
    option domain-name "usuarios.xelajunetwork.lan";
    # SIN sentencia "range": no existen direcciones dinamicas que repartir.
}

# Reservas por MAC: un bloque "host" por cada fila del CSV. El archivo lo
# genera xelaju-dhcp; esta en /etc/dhcp porque AppArmor solo deja a dhcpd leer
# configuracion de ese directorio.
include "/etc/dhcp/reservas-vlan20.conf";
