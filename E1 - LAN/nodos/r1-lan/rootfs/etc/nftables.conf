#!/usr/sbin/nft -f
# /etc/nftables.conf - R1-LAN
#
# Lo carga nftables.service al arrancar, ANTES de levantar la red. Por eso las
# reglas nombran las interfaces como texto (iifname/oifname): no hace falta que
# existan todavia.
#
# "flush ruleset" + los include forman UNA sola transaccion: o se cargan todas
# las reglas o no cambia nada (nunca queda el router a medio configurar).
#
# Los archivos se incluyen en orden alfabetico:
#   00-definiciones.nft   nombres de redes, equipos e interfaces
#   10-registrados.nft    conjunto MAC . IP generado por xelaju-dhcp desde el CSV
#   20-modo.nft           enlace simbolico a modos/individual.nft o modos/grupal.nft
#   30-acl.nft            ACL: cadenas entrada (INPUT) y reenvio (FORWARD)

flush ruleset

include "/etc/nftables.d/*.nft"
