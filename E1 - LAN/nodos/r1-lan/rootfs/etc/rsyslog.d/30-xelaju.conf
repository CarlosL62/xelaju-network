# /etc/rsyslog.d/30-xelaju.conf - R1-LAN: registros propios del proyecto
# Los archivos se crean como root:adm 0640 (valores por omision de rsyslog en Debian).

# ACL: las reglas "log" de nftables escriben en el registro del kernel con un
# prefijo que empieza por "ACL-" (ACL-DENY, ACL-ALLOW, ACL-SPOOF).
:msg, contains, "ACL-" /var/log/xelaju/acl-lan.log
& stop

# DHCP: dhcpd usa la facilidad local7 (log-facility en dhcpd.conf).
local7.* /var/log/xelaju/dhcpd.log
& stop
