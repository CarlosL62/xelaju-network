# /etc/sysctl.d/80-xelaju-comun.conf - ajustes del kernel comunes a todos los nodos
# (instalado por nodos/_comun/comun.sh)

# El proyecto es solo IPv4: se apaga IPv6 para que no exista un camino sin filtrar.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# La consola serie solo muestra errores graves del kernel. Sin esto, cada
# paquete registrado por las ACL (y cada cambio de estado de un puerto del
# bridge) se imprimiria encima de lo que se esta escribiendo en la consola.
kernel.printk = 3 4 1 3
