# /etc/xelaju/switch.conf - SW-ACC01 (switch de acceso)
# Lo leen switch-aplicar y switch-mostrar. Formato: variables de shell.

NOMBRE="SW-ACC01"

# VLAN que conoce el switch, como  id:NOMBRE. La VLAN 30 (SERVIDORES) no llega
# a este switch: no tiene servidores y se poda en la troncal.
VLANS="10:ADMIN 20:USUARIOS 40:GESTION"

# Gestion del switch: una IP estatica en la VLAN 40 (equivale a: interface vlan 40)
VLAN_GESTION=40
IP_GESTION="192.168.40.3/24"
GW_GESTION="192.168.40.1"
