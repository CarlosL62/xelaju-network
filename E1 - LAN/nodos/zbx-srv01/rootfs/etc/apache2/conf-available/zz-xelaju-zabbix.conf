# /etc/apache2/conf-available/zz-xelaju-zabbix.conf - ZBX-SRV01
#
# Tercera capa de la restriccion: Apache solo sirve la interfaz web de Zabbix
# a la VLAN ADMIN (y al propio servidor, para comprobaciones locales).
# A cualquier otro origen le responde 403 Forbidden.
#
# El nombre empieza por "zz-" para que Apache lo cargue DESPUES de zabbix.conf
# (orden alfabetico): al repetirse el mismo <Directory>, las reglas "Require"
# de la ultima seccion sustituyen al "Require all granted" del paquete.

<Directory "/usr/share/zabbix">
    Require ip 192.168.10.0/24 127.0.0.1

    <IfModule mod_php.c>
        php_value date.timezone America/Guatemala
    </IfModule>
</Directory>

# La pagina por omision de Apache tampoco se publica al resto de la red.
<Directory "/var/www/html">
    Require ip 192.168.10.0/24 127.0.0.1
</Directory>
