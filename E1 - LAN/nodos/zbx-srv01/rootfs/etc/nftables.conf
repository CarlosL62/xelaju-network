#!/usr/sbin/nft -f
# /etc/nftables.conf - ZBX-SRV01: cortafuegos del propio servidor Zabbix
#
# Segunda de las tres capas que restringen la web de Zabbix a la VLAN ADMIN:
#   1. ACL de R1-LAN (nadie mas que ADMIN llega al puerto 80 de este servidor)
#   2. ESTE archivo (aunque R1 fallara, el servidor solo acepta 80 desde ADMIN)
#   3. Apache: "Require ip 192.168.10.0/24" en zz-xelaju-zabbix.conf
#
# Solo hay cadena de entrada: este equipo no reenvia trafico.

flush ruleset

# Mismos nombres y valores que 00-definiciones.nft de R1 (core/ADDRESSING.yaml)
define RED_ADMIN   = 192.168.10.0/24
define RED_USERS   = 192.168.20.0/24
define RED_SERVERS = 192.168.30.0/24
define RED_MGMT    = 192.168.40.0/24
define REDES_LAN   = { $RED_ADMIN, $RED_USERS, $RED_SERVERS, $RED_MGMT }
# Parte grupal
define RED_VPN_ADMIN    = 10.200.10.0/24     # clientes VPN administradores
define REDES_TRANSITO   = { 192.168.81.0/30, 192.168.82.0/30, 192.168.83.0/30, 192.168.84.0/30 }

table inet xelaju_zbx {
    chain entrada {
        type filter hook input priority filter; policy drop;

        ct state vmap { established : accept, related : accept, invalid : drop }
        iifname "lo" accept

        # Ping desde la LAN y los administradores por VPN (diagnostico)
        ip saddr { $REDES_LAN, $RED_VPN_ADMIN } icmp type echo-request counter accept

        # Interfaz web de Zabbix: SOLO la VLAN ADMIN
        ip saddr $RED_ADMIN tcp dport 80 counter accept

        # Puerto 10051 (trapper): aqui se conectan los agentes en modo activo.
        #   SERVIDORES: R1-LAN (sale con 192.168.30.1) y SRV-INTRA01
        #   GESTION:    SW-CORE01 y SW-ACC01
        #   Transito:   agentes de los companeros (modo grupal): salen con la IP
        #               de su enlace /30, por ejemplo el Multi-WAN con 192.168.81.1
        ip saddr { $RED_SERVERS, $RED_MGMT, $REDES_TRANSITO } tcp dport 10051 counter accept

        # SSH para administrar el servidor
        ip saddr { $RED_ADMIN, $RED_MGMT, $RED_VPN_ADMIN } tcp dport 22 counter accept

        meta pkttype { broadcast, multicast } counter drop
        log prefix "ZBX-DENY " counter drop
    }

    # El servidor inicia sus comprobaciones (ping, agentes pasivos, SNMP)
    chain salida {
        type filter hook output priority filter; policy accept;
    }
}
