# =============================================================================
# grupal/matriz-grupal.conf - pruebas de R1-LAN en MODO GRUPAL
#
# Mismo formato que pruebas/matriz.conf (lo lee pruebas/probar.sh):
#     sudo XJ_MATRIZ=/mnt/proyecto/grupal/matriz-grupal.conf \
#          /mnt/proyecto/pruebas/probar.sh <perfil>
# Los perfiles g-* se ejecutan en equipos de la LAN del Est. 1. Los demas
# describen lo que debe ocurrir desde los equipos de los companeros: alli se
# comprueban a mano (ping, curl, nc) siguiendo grupal/pruebas-grupales.md.
# El ensayo sin VMs los ejecuta todos:   ./pruebas/simular-lan.sh grupal
#
# Las direcciones son las de core/ADDRESSING.yaml. La columna "decide" de cada
# descripcion dice quien toma la decision: [R1] las ACL de R1-LAN, [E5] el
# firewall perimetral. R1 no repite la politica VPN (ADR-0002): en el ensayo,
# lo marcado [E5] lo aplica un doble de prueba con las reglas PROPUESTAS en ese
# ADR, y cambiara si el Est. 5 decide otra cosa.
#
# perfil <nombre> <equipo donde se ejecuta>
perfil g-admin      pc-admin01
perfil g-users      pc-user01
perfil g-mgmt       pc-mgmt01
perfil g-zbx        zbx-srv01
perfil e2           e2
perfil e3           e3
perfil e4           e4
perfil vpn-admin    vpn-admin
perfil vpn-users    vpn-users
perfil dmz          web01
# =============================================================================
# caso | perfil | tipo | destino | puerto | esperado | descripcion

# ---- Enlace /30 con Squid: el vecino alcanza a R1, pero no lo administra ------
GS1 | e2 | ping | 192.168.84.2                  | -     | OK        | [R1] Squid (.84.1) hace ping a R1 up-squid (.84.2)
GS2 | e2 | tcp  | 192.168.84.2                  | 22    | BLOQUEADO | [R1] SSH a R1 desde el enlace de salida: denegado
GS3 | e3 | ping | 192.168.84.2                  | -     | OK        | [R1] El Multi-WAN llega a R1 pasando por E5 y E2 (prueba de rutas)

# ---- Desde la LAN en modo grupal: todo sale por E2 (ruta por defecto) ----------
GL1 | g-admin | ping | 192.168.84.1             | -     | OK        | [R1] ADMIN -> vecino Squid
GL2 | g-admin | http | 172.16.10.10:8081/       | 8081  | 200       | [R1][E5] ADMIN -> WEB01 de la DMZ por E2 -> E5 -> E4
GL3 | g-users | http | 172.16.10.10:8081/       | 8081  | 200       | [R1][E5] USUARIOS -> WEB01 de la DMZ
GL4 | g-users | tcp  | 172.16.10.10             | 22    | BLOQUEADO | [E5] LAN -> DMZ: solo el puerto de WEB01
GL5 | g-mgmt  | http | 172.16.10.10:8081/       | 8081  | BLOQUEADO | [R1] GESTION solo sale a web y DNS (80, 443, 53)
GL6 | g-zbx   | http | 172.16.10.10:8081/       | 8081  | 200       | [R1][E5] SERVIDORES -> WEB01 de la DMZ

# ---- VPN-ADMIN (10.200.10.0/24): todas las VLAN, salvo la web de Zabbix --------
GA1 | vpn-admin | ping | 192.168.10.50          | -     | OK        | [E5] VPN-ADMIN -> ADMIN (R1 lo deja pasar)
GA2 | vpn-admin | tcp  | 192.168.20.10          | 22    | OK        | [E5] VPN-ADMIN -> USUARIOS
GA3 | vpn-admin | ping | 192.168.30.10          | -     | OK        | [E5] VPN-ADMIN -> ping a Zabbix
GA4 | vpn-admin | http | 192.168.30.20/         | 80    | 200       | [E5] VPN-ADMIN -> Intranet
GA5 | vpn-admin | tcp  | 192.168.40.2           | 22    | OK        | [E5] VPN-ADMIN -> SSH de SW-CORE01
GA6 | vpn-admin | http | 192.168.30.10/zabbix/  | 80    | BLOQUEADO | [R1] Web de Zabbix: solo la VLAN ADMIN, tampoco por VPN

# ---- VPN-USERS (10.200.20.0/24): red de usuarios e Intranet web ----------------
GU1 | vpn-users | ping  | 192.168.20.10         | -     | OK        | [E5] VPN-USERS -> USUARIOS
GU2 | vpn-users | http  | 192.168.30.20/        | 80    | 200       | [E5] VPN-USERS -> Intranet HTTP (servicio permitido de la VLAN 30)
GU3 | vpn-users | https | 192.168.30.20/        | 443   | 200       | [E5] VPN-USERS -> Intranet HTTPS
GU4 | vpn-users | tcp   | 192.168.30.20         | 22    | BLOQUEADO | [E5] VPN-USERS -> SSH de la Intranet: fuera de la lista de servicios
GU5 | vpn-users | ping  | 192.168.10.50         | -     | BLOQUEADO | [E5] VPN-USERS -> ADMIN: denegado
GU6 | vpn-users | tcp   | 192.168.40.2          | 22    | BLOQUEADO | [E5] VPN-USERS -> GESTION: denegado
GU7 | vpn-users | http  | 192.168.30.10/zabbix/ | 80    | BLOQUEADO | [E5][R1] VPN-USERS -> web de Zabbix: denegado

# ---- DMZ (172.16.10.0/24): nunca inicia conexiones hacia la LAN ----------------
GD1 | dmz | ping | 192.168.10.50                | -     | BLOQUEADO | [E5][R1] DMZ -> ADMIN: denegado
GD2 | dmz | ping | 192.168.20.10                | -     | BLOQUEADO | [E5][R1] DMZ -> USUARIOS: denegado
GD3 | dmz | http | 192.168.30.20/               | 80    | BLOQUEADO | [E5][R1] DMZ -> Intranet: denegado

# ---- Monitoreo: los agentes de los companeros entregan metricas a Zabbix -------
GW1 | e3 | tcp  | 192.168.30.10                 | 10051 | OK        | [E5][R1] Agente del Multi-WAN (192.168.81.1) -> Zabbix TCP 10051
GW2 | e3 | http | 192.168.30.10/zabbix/         | 80    | BLOQUEADO | [E5][R1] Multi-WAN -> web de Zabbix: denegado
GW3 | e3 | ping | 192.168.10.50                 | -     | BLOQUEADO | [E5][R1] Multi-WAN -> ADMIN: denegado
GW4 | e4 | tcp  | 192.168.30.10                 | 10051 | OK        | [E5][R1] Agente de VPN/DMZ (192.168.83.2) -> Zabbix TCP 10051
GW5 | e4 | ping | 192.168.20.10                 | -     | BLOQUEADO | [E5][R1] VPN/DMZ -> USUARIOS: denegado
GW6 | e2 | tcp  | 192.168.30.10                 | 10051 | OK        | [R1] Agente de Squid (192.168.84.1) -> Zabbix TCP 10051
GW7 | e2 | ping | 192.168.10.50                 | -     | BLOQUEADO | [R1] Squid -> ADMIN: denegado
