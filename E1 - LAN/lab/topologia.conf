# =============================================================================
# lab/topologia.conf — UNICA fuente de verdad del laboratorio XelajuNetwork
# Estudiante 1 (LAN, VLANs, router inter-VLAN, ACL, DHCP restringido, Zabbix)
#
# De este archivo leen:
#   - lab/lab.sh            arma la linea de comandos de QEMU de cada VM
#   - nodos/_comun/comun.sh fija el nombre de cada interfaz segun su MAC
#   - pruebas/consistencia.py y pruebas/simular-lan.sh (validacion sin VMs)
#
# Formato: una declaracion por linea, campos separados por espacios.
# Lo que sigue a un '#' es comentario.
# =============================================================================

# ---- Opciones generales -----------------------------------------------------
# opcion  <clave>        <valor>
opcion    udp_base       40000     # el cable cNN usa los puertos UDP base+2N y base+2N+1
opcion    disco_gb       12        # tamano virtual del disco (qcow2 delgado: solo ocupa lo escrito)
opcion    base_ram_mb    2048      # RAM de la VM temporal que instala la imagen base

# ---- Maquinas virtuales -----------------------------------------------------
# vm  <nombre>      <ram_MB>  <cpus>  <pantalla>  <grupo>
#     pantalla: none = solo consola serie | gtk = ventana grafica (clientes con GUI)
#     grupo:    para arrancar por partes (lab.sh iniciar infra|servidores|clientes)
vm    r1-lan        512       1       none        infra
vm    sw-core01     384       1       none        infra
vm    sw-acc01      384       1       none        infra
vm    zbx-srv01     2048      2       none        servidores
vm    srv-intra01   384       1       none        servidores
vm    pc-mgmt01     384       1       none        clientes
vm    pc-admin01    1536      2       gtk         clientes
vm    pc-user01     1536      2       gtk         clientes
vm    pc-user02     384       1       none        clientes
vm    pc-intruso    384       1       none        clientes
# RAM total con todo encendido: 7936 MB (unos 7,8 GB)

# ---- Interfaces de red ------------------------------------------------------
# nic  <vm>         <interfaz>  <MAC>               <conexion>
#   conexion:
#     cable:cNN      extremo de un cable virtual punto a punto (cada cable aparece 2 veces)
#     nat:<puerto>   NAT de QEMU en modo usuario; reenvia 127.0.0.1:<puerto> del host al SSH de la VM
#     tap:<nombre>   usa esa interfaz TAP del host si existe (modo grupal); si no, queda aislada
#     aislado        puerto sin cable (hub interno de QEMU sin mas puertos)
#   MAC: 52:54:00:<equipo>:00:<puerto>; los PC de usuarios usan las MAC del enunciado.

# R1-LAN: router inter-VLAN
nic    r1-lan       trunk0      52:54:00:01:00:00   cable:c01          # troncal 802.1Q a SW-CORE01
nic    r1-lan       up-squid    52:54:00:01:00:01   tap:tap-r1-squid   # unico enlace /30 del grupo: hacia Squid (E2)
nic    r1-lan       tmp-nat     52:54:00:01:00:03   nat:2221           # salida temporal (individual)

# SW-CORE01: switch de nucleo
nic    sw-core01    p0          52:54:00:02:00:00   cable:c01          # troncal a R1-LAN
nic    sw-core01    p1          52:54:00:02:00:01   cable:c02          # troncal a SW-ACC01
nic    sw-core01    p2          52:54:00:02:00:02   cable:c03          # acceso VLAN 30: ZBX-SRV01
nic    sw-core01    p3          52:54:00:02:00:03   cable:c04          # acceso VLAN 30: SRV-INTRA01
nic    sw-core01    p4          52:54:00:02:00:04   cable:c05          # acceso VLAN 40: PC-MGMT01
nic    sw-core01    p5          52:54:00:02:00:05   aislado            # SPAN (espejo de p0)

# SW-ACC01: switch de acceso
nic    sw-acc01     p0          52:54:00:03:00:00   cable:c02          # troncal a SW-CORE01
nic    sw-acc01     p1          52:54:00:03:00:01   cable:c06          # acceso VLAN 10: PC-ADMIN01
nic    sw-acc01     p2          52:54:00:03:00:02   cable:c07          # acceso VLAN 20: PC-USER01
nic    sw-acc01     p3          52:54:00:03:00:03   cable:c08          # acceso VLAN 20: PC-USER02
nic    sw-acc01     p4          52:54:00:03:00:04   cable:c09          # acceso VLAN 20: PC-INTRUSO

# Servidores (VLAN 30)
nic    zbx-srv01    lan0        52:54:00:30:00:10   cable:c03
nic    srv-intra01  lan0        52:54:00:30:00:20   cable:c04

# Clientes
nic    pc-mgmt01    lan0        52:54:00:40:00:10   cable:c05
nic    pc-admin01   lan0        52:54:00:10:00:50   cable:c06
nic    pc-user01    lan0        aa:bb:cc:dd:ee:01   cable:c07          # registrada en usuarios.csv
nic    pc-user02    lan0        aa:bb:cc:dd:ee:02   cable:c08          # registrada en usuarios.csv
nic    pc-intruso   lan0        aa:bb:cc:dd:ee:99   cable:c09          # NO registrada

# ---- Direccionamiento IPv4 --------------------------------------------------
# Las VLAN, sus puertas de enlace, el enlace up-squid (link_e1_e2) y la IP de
# Zabbix son datos compartidos del grupo: su fuente de verdad es
# core/ADDRESSING.yaml, en la raiz del repositorio. pruebas/consistencia.py
# comprueba que este archivo dice lo mismo.
# ip  <vm>          <interfaz>  <direccion/prefijo>  <gateway>      <metodo>   <modo>
#     metodo: estatica | dhcp (reserva por MAC en R1) | ninguna
#     modo:   siempre | individual | grupal
ip    r1-lan        trunk0.10   192.168.10.1/24      -              estatica   siempre
ip    r1-lan        trunk0.20   192.168.20.1/24      -              estatica   siempre
ip    r1-lan        trunk0.30   192.168.30.1/24      -              estatica   siempre
ip    r1-lan        trunk0.40   192.168.40.1/24      -              estatica   siempre
ip    r1-lan        tmp-nat     10.0.2.15/24         10.0.2.2       estatica   individual
ip    r1-lan        up-squid    192.168.84.2/30      192.168.84.1   estatica   grupal
ip    sw-core01     br0.40      192.168.40.2/24      192.168.40.1   estatica   siempre
ip    sw-acc01      br0.40      192.168.40.3/24      192.168.40.1   estatica   siempre
ip    zbx-srv01     lan0        192.168.30.10/24     192.168.30.1   estatica   siempre
ip    srv-intra01   lan0        192.168.30.20/24     192.168.30.1   estatica   siempre
ip    pc-mgmt01     lan0        192.168.40.10/24     192.168.40.1   estatica   siempre
ip    pc-admin01    lan0        192.168.10.50/24     192.168.10.1   estatica   siempre
ip    pc-user01     lan0        192.168.20.10/24     192.168.20.1   dhcp       siempre
ip    pc-user02     lan0        192.168.20.11/24     192.168.20.1   dhcp       siempre
ip    pc-intruso    lan0        -                    -              ninguna    siempre
