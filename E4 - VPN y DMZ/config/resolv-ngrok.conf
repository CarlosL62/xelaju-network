# Resolvedores usados solo por scripts/run_ngrok.sh y scripts/with_dns.sh (espacio de montajes privado).
# E5 permite DNS (UDP/TCP 53) hacia cualquier destino de Internet desde 192.168.83.2.
# El orden importa: el operador móvil detrás de ISP2 descarta el UDP/53 hacia toda
# dirección excepto 8.8.8.8 (confirmado por E3; el TCP/53 y el otro ISP no se ven
# afectados), por lo que 8.8.8.8 debe ir primero. Los otros dos solo ayudan cuando el
# tráfico sale por ISP1.
# timeout/attempts hacen que una consulta perdida cueste 1 s en lugar de los 5 s por defecto.
nameserver 8.8.8.8
nameserver 9.9.9.9
nameserver 1.1.1.1
options timeout:1 attempts:3
