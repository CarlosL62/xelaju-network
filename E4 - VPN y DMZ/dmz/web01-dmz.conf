Listen 8081

<VirtualHost *:8081>
    ServerName web01-dmz.local
    DocumentRoot /var/www/web01-dmz

    <Directory /var/www/web01-dmz>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/web01-dmz-error.log
    CustomLog ${APACHE_LOG_DIR}/web01-dmz-access.log combined
</VirtualHost>
