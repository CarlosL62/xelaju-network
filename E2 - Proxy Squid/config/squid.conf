#==============================================================
# squid.conf - Estudiante 2: Proxy transparente
# XelajuNetwork - Lab. Redes de Computadoras 2
#==============================================================

# Puerto para trafico interceptado (transparente)
http_port 3129 intercept

# Puerto explicito (administracion/pruebas)
http_port 3128

#--------------------------------------------------------------
# Redes de origen de clientes (alineado con core/ADDRESSING.yaml PR #4)
# LAN_VLANS: 192.168.10.0/24 (ADMIN), 192.168.20.0/24 (USERS)
#            192.168.30.0/24 (SERVERS), 192.168.40.0/24 (MGMT)
# No interceptar trafico hacia DMZ 172.16.10.0/24 ni hacia VPN
#--------------------------------------------------------------
acl admin_net src 192.168.10.0/24
acl users_net src 192.168.20.0/24
acl servers_net src 192.168.30.0/24
acl mgmt_net  src 192.168.40.0/24

acl dmz_net dst 172.16.10.0/24
acl vpn_nets dst 10.200.10.0/24 10.200.20.0/24

#--------------------------------------------------------------
# Listas de bloqueo externas (modificables sin tocar squid.conf)
#--------------------------------------------------------------
acl admin_blacklist dstdomain "/etc/squid/lists/admins_blacklist"
acl users_blacklist dstdomain "/etc/squid/lists/users_blacklist"

#--------------------------------------------------------------
# Puertos y metodos
#--------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl CONNECT method CONNECT

#--------------------------------------------------------------
# Reglas de acceso
#--------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Bloqueo por politica segun VLAN de origen
http_access deny admin_net admin_blacklist
http_access deny users_net users_blacklist

# No interceptar trafico LAN->DMZ ni LAN->VPN (flujo interno pasa por ruta larga pero
# se evita bucle/redireccion innecesaria y permite acceso directo por ruta establecida)
http_access allow admin_net dmz_net
http_access allow users_net dmz_net
http_access allow servers_net dmz_net
http_access allow mgmt_net dmz_net
http_access allow admin_net vpn_nets
http_access allow users_net vpn_nets
http_access allow servers_net vpn_nets
http_access allow mgmt_net vpn_nets

# Permitir navegacion al resto desde VLANs internas
http_access allow admin_net
http_access allow users_net
http_access allow servers_net
http_access allow mgmt_net

# Denegar todo lo demas
http_access deny all

#--------------------------------------------------------------
# Logs
#--------------------------------------------------------------
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

#--------------------------------------------------------------
# Cache y rendimiento
#--------------------------------------------------------------
cache_dir ufs /var/spool/squid 100 16 256
coredump_dir /var/spool/squid
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
