# ==============================================================================
# XelajuNetwork - Zabbix Agent UserParameter para Multi-WAN (Estudiante 3)
# Servidor Zabbix destino: 192.168.30.10 (VLAN 30 - Servidores)
# ==============================================================================

Server=192.168.30.10
ServerActive=192.168.30.10
Hostname=Router-MultiWAN-E3

# Metricas ISP 1 (wlp3s0)
UserParameter=multiwan.isp1.rx_bytes,cat /sys/class/net/wlp3s0/statistics/rx_bytes 2>/dev/null || echo 0
UserParameter=multiwan.isp1.tx_bytes,cat /sys/class/net/wlp3s0/statistics/tx_bytes 2>/dev/null || echo 0
UserParameter=multiwan.isp1.rx_packets,cat /sys/class/net/wlp3s0/statistics/rx_packets 2>/dev/null || echo 0
UserParameter=multiwan.isp1.tx_packets,cat /sys/class/net/wlp3s0/statistics/tx_packets 2>/dev/null || echo 0

# Metricas ISP 2 (wlxc006c3bf886a)
UserParameter=multiwan.isp2.rx_bytes,cat /sys/class/net/wlxc006c3bf886a/statistics/rx_bytes 2>/dev/null || echo 0
UserParameter=multiwan.isp2.tx_bytes,cat /sys/class/net/wlxc006c3bf886a/statistics/tx_bytes 2>/dev/null || echo 0
UserParameter=multiwan.isp2.rx_packets,cat /sys/class/net/wlxc006c3bf886a/statistics/rx_packets 2>/dev/null || echo 0
UserParameter=multiwan.isp2.tx_packets,cat /sys/class/net/wlxc006c3bf886a/statistics/tx_packets 2>/dev/null || echo 0
